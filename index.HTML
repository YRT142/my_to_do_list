<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>MY TO DO LIST</h1>

        <!-- Add Task Form -->
        <div class="task-input-section">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button id="addTaskBtn">Add Task</button>
        </div>

        <!-- Task List -->
        <ul id="taskList">
            <!-- Initial Tasks -->
            <li class="task-item">
                <span class="task-text">Buy groceries</span>
                <button class="delete-btn">Delete Task</button>
            </li>
            <li class="task-item">
                <span class="task-text">Finish JavaScript assignment</span>
                <button class="delete-btn">Delete Button</button>
            </li>
            <li class="task-item">
                <span class="task-text">Call the electrician</span>
                <button class="delete-btn">Delete Button</button>
            </li>
        </ul>

        <!-- Task Counter -->
        <div class="counter-section">
            <p id="taskCounter">3 out of 3 task remaining</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
